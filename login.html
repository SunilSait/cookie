<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your CookieCraft account to manage your orders, subscription, and custom cookie boxes.">
    <title>Login | CookieCraft</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='cg' x1='10%25' y1='10%25' x2='90%25' y2='90%25'%3E%3Cstop offset='0%25' stop-color='%23F59E0B'/%3E%3Cstop offset='100%25' stop-color='%23B45309'/%3E%3C/linearGradient%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23F472B6'/%3E%3Cstop offset='100%25' stop-color='%23DB2777'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='46' cy='58' r='36' fill='url(%23cg)'/%3E%3Cpath d='M22 52 C28 42,36 62,44 50 C52 38,58 58,66 48' stroke='white' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='28' cy='72' r='3.5' fill='white'/%3E%3Ccircle cx='42' cy='76' r='3' fill='white'/%3E%3Ccircle cx='56' cy='74' r='3.5' fill='white'/%3E%3Cpath d='M76 4 L88 2 L82 24 L78 24 Z' fill='url(%23bg)'/%3E%3Cpath d='M78 24 L82 24 L80 30 Z' fill='%239D174D'/%3E%3Cpath d='M80 30 Q78 38,66 48' stroke='white' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Playfair Display', 'serif'],
                        body: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300 font-body min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

<!-- Decorative Background Circles -->
<div class="fixed inset-0 z-0 bg-cover bg-center filter blur-[6px] scale-105" style="background-image: url('assets/gallery-hero.jpg');"></div>
<div class="fixed inset-0 z-0 bg-gray-950/60 dark:bg-gray-950/80 transition-colors duration-500"></div>

<!-- RTL & Dark Mode Toggles (Outside the Card) -->
<div class="fixed top-6 right-6 z-50 flex items-center gap-2">
    <button class="js-dir-toggle w-9 h-9 flex items-center justify-center rounded-xl bg-gray-100/50 hover:bg-gray-100 dark:bg-gray-800/50 dark:hover:bg-gray-800 border border-gray-200/20 dark:border-gray-700/50 text-gray-800 dark:text-white transition-all text-[9px] font-black uppercase" aria-label="Toggle text direction">
        <span>LTR</span>
    </button>
    <button class="js-theme-toggle w-9 h-9 flex items-center justify-center rounded-xl bg-gray-100/50 hover:bg-gray-100 dark:bg-gray-800/50 dark:hover:bg-gray-800 border border-gray-200/20 dark:border-gray-700/50 text-gray-800 dark:text-white transition-all" aria-label="Toggle theme">
        <i class="fas fa-moon text-xs"></i>
    </button>
</div>

<!-- Login Container -->
<div class="relative z-10 w-full max-w-md my-8">
    <div class="glass relative overflow-hidden rounded-[2.5rem] p-8 md:p-10 shadow-2xl bg-white/80 dark:bg-gray-950/80 border border-amber-100/20 dark:border-gray-800/80 transition-all duration-300">
        

        <a href="index.html" class="flex items-center justify-center space-x-3 mb-8 group">
            <div class="w-10 h-10 flex-shrink-0">
                <svg class="w-full h-full group-hover:scale-110 group-hover:rotate-6 transition-transform duration-500" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="login-cookie-grad" x1="10%" y1="10%" x2="90%" y2="90%">
                            <stop offset="0%" stop-color="#F59E0B" />
                            <stop offset="50%" stop-color="#D97706" />
                            <stop offset="100%" stop-color="#B45309" />
                        </linearGradient>
                        <linearGradient id="login-bag-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#F472B6" />
                            <stop offset="100%" stop-color="#DB2777" />
                        </linearGradient>
                        <filter id="login-glow" x="-10%" y="-10%" width="120%" height="120%">
                            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D97706" flood-opacity="0.3" />
                        </filter>
                    </defs>
                    <circle cx="46" cy="58" r="34" fill="url(#login-cookie-grad)" filter="url(#login-glow)" />
                    <path d="M15 68 C21 80, 37 90, 52 90 C69 90, 78 78, 78 58 C78 61, 72 86, 46 86 C24 86, 15 72, 15 68 Z" fill="#78350F" opacity="0.15" />
                    <path d="M22 52 C28 42, 36 62, 44 50 C52 38, 58 58, 66 48" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.92" />
                    <circle cx="28" cy="70" r="3" fill="#FFFFFF" opacity="0.88" />
                    <circle cx="40" cy="75" r="2.5" fill="#FFFFFF" opacity="0.85" />
                    <circle cx="52" cy="73" r="3" fill="#FFFFFF" opacity="0.88" />
                    <circle cx="63" cy="67" r="2.5" fill="#FFFFFF" opacity="0.85" />
                    <circle cx="34" cy="40" r="2" fill="#FFFFFF" opacity="0.7" />
                    <circle cx="50" cy="38" r="2" fill="#FFFFFF" opacity="0.7" />
                    <path d="M74 4 L86 2 L80 24 L76 24 Z" fill="url(#login-bag-grad)" />
                    <path d="M76 24 L80 24 L78 30 Z" fill="#9D174D" />
                    <path d="M78 30 Q76 38, 66 48" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />
                    <path d="M90 32 L91.5 37 L96 38.5 L91.5 40 L90 45 L88.5 40 L84 38.5 L88.5 37 Z" fill="#FFF" opacity="0.95" />
                    <path d="M16 34 L17 37 L20 38 L17 39 L16 42 L15 39 L12 38 L15 37 Z" fill="#FBBF24" opacity="0.8" />
                </svg>
            </div>
            <span class="font-black text-2xl tracking-tight text-amber-700 dark:text-amber-500 group-hover:text-amber-600 dark:group-hover:text-amber-400 transition-colors" style="font-family: 'Playfair Display', serif;">
                CookieCraft
            </span>
        </a>

        <!-- Form -->
        <form id="login-form" class="space-y-5" onsubmit="handleLogin(event)">
            <!-- Email Field -->
            <div class="space-y-1.5">
                <label for="email" class="block text-[10px] font-black uppercase tracking-widest text-gray-500 dark:text-gray-400">Email Address</label>
                <div class="relative">
                    <input type="email" id="email" required placeholder="name@example.com" class="w-full px-4 py-3.5 text-sm rounded-xl border border-gray-200 dark:border-gray-700 bg-white/50 dark:bg-gray-900/50 text-gray-900 dark:text-white placeholder-gray-400 focus:border-amber-600 focus:ring-1 focus:ring-amber-600 outline-none transition-all">
                </div>
            </div>

            <!-- Password Field -->
            <div class="space-y-1.5">
                <label for="password" class="block text-[10px] font-black uppercase tracking-widest text-gray-500 dark:text-gray-400">Password</label>
                <div class="relative">
                    <input type="password" id="password" required placeholder="••••••••" class="w-full pl-4 pr-11 py-3.5 text-sm rounded-xl border border-gray-200 dark:border-gray-700 bg-white/50 dark:bg-gray-900/50 text-gray-900 dark:text-white placeholder-gray-400 focus:border-amber-600 focus:ring-1 focus:ring-amber-600 outline-none transition-all rtl:pl-11 rtl:pr-4">
                    <button type="button" onclick="togglePasswordVisibility('password', this)" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-amber-600 transition-colors rtl:right-auto rtl:left-0 rtl:pr-0 rtl:pl-4" aria-label="Toggle password visibility">
                        <i class="fas fa-eye text-sm" id="password-toggle-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="flex items-center justify-between text-xs pt-1">
                <label class="flex items-center gap-2 text-gray-600 dark:text-gray-400 cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 rounded border-gray-300 dark:border-gray-700 text-amber-600 focus:ring-amber-500 bg-white/50 dark:bg-gray-900/50 transition-colors">
                    <span class="font-bold select-none text-[11px] uppercase tracking-wider">Remember Me</span>
                </label>
                <a href="#" class="text-amber-700 dark:text-amber-500 hover:underline font-bold text-[11px] uppercase tracking-wider">Forgot Password?</a>
            </div>

            <!-- CTA Button -->
            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-4 rounded-xl font-black uppercase tracking-widest text-xs transition-all active:scale-95 shadow-lg shadow-amber-600/20 btn-shine mt-2">
                Sign In
            </button>

            <!-- Divider -->
            <div class="relative flex items-center justify-center my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-200 dark:border-gray-800"></div>
                </div>
                <span class="relative z-10 px-4 text-[9px] font-black uppercase tracking-widest text-gray-400 bg-white/90 dark:bg-gray-950/90 rounded-full py-0.5 border border-gray-100 dark:border-gray-800 transition-colors">Or Sign In With</span>
            </div>

            <!-- Social Logins -->
            <div class="grid grid-cols-3 gap-3">
                <button type="button" class="flex items-center justify-center py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-white/50 dark:bg-gray-900/50 hover:bg-white dark:hover:bg-gray-800 hover:shadow-md transition-all active:scale-95 text-gray-700 dark:text-gray-200" aria-label="Sign in with Google">
                    <i class="fab fa-google text-base"></i>
                </button>
                <button type="button" class="flex items-center justify-center py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-white/50 dark:bg-gray-900/50 hover:bg-white dark:hover:bg-gray-800 hover:shadow-md transition-all active:scale-95 text-gray-700 dark:text-gray-200" aria-label="Sign in with Apple">
                    <i class="fab fa-apple text-base"></i>
                </button>
                <button type="button" class="flex items-center justify-center py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-white/50 dark:bg-gray-900/50 hover:bg-white dark:hover:bg-gray-800 hover:shadow-md transition-all active:scale-95 text-gray-700 dark:text-gray-200" aria-label="Sign in with Facebook">
                    <i class="fab fa-facebook-f text-base"></i>
                </button>
            </div>
        </form>

        <!-- Footer Link -->
        <div class="mt-8 text-center text-xs border-t border-gray-100 dark:border-gray-800 pt-6">
            <span class="text-gray-500 dark:text-gray-400">Don't have an account?</span>
            <a href="signup.html" class="text-amber-700 dark:text-amber-500 font-black uppercase tracking-widest hover:underline ml-1 rtl:mr-1">Sign Up</a>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>
    function togglePasswordVisibility(fieldId, btn) {
        const field = document.getElementById(fieldId);
        const icon = btn.querySelector('i');
        if (field.type === 'password') {
            field.type = 'text';
            icon.className = 'fas fa-eye-slash text-sm';
        } else {
            field.type = 'password';
            icon.className = 'fas fa-eye text-sm';
        }
    }

    function handleLogin(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        btn.innerHTML = '<i class="fas fa-cookie-bite animate-spin mr-2"></i> Signing In...';
        btn.disabled = true;
        
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 1000);
    }
</script>
</body>
</html>
